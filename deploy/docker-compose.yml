services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulsewatch
      POSTGRES_PASSWORD: pulsewatch
      POSTGRES_DB: pulsewatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 5433 on the host to avoid clashing with a local PostgreSQL.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsewatch -d pulsewatch"]
      interval: 5s
      timeout: 3s
      retries: 10

  pulsewatch:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PULSEWATCH_POSTGRES_DSN: postgres://pulsewatch:pulsewatch@postgres:5432/pulsewatch?sslmode=disable
      PULSEWATCH_LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "50051:50051"
      - "2112:2112"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2112/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - pulsewatch

volumes:
  pgdata:
