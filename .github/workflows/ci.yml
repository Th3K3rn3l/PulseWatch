name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f deploy/Dockerfile -t pulsewatch:ci .
      - name: Validate compose config
        run: docker compose -f deploy/docker-compose.yml config --quiet
      - name: Smoke test compose stack
        run: |
          cd deploy
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:2112/healthz >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:2112/metrics | grep -q pulsewatch_jobs_dropped_total
          docker compose ps
          docker compose logs pulsewatch
          docker compose down -v
